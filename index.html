<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SantosJI</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="favicon" href="https://avatars.githubusercontent.com/u/195976820?v=4" />
  </head>
  <body>
    <header>
      <div class="container">
        <img class="profile-avatar" id="avatar" alt="." />
        <h1 class="profile-name" id="name"></h1>
        <h2 class="profile-username" id="username"></h2>
        <ul class="numbers">
          <li class="numbers-item">
            <h4>Repositórios</h4>
            <span id="repository"></span>
          </li>
          <li class="numbers-item">
            <h4>Seguidores</h4>
            <span id="followers"></span>
          </li>
          <li class="numbers-item">
            <h4>Seguindo</h4>
            <span id="following"></span>
          </li>
        </ul>
        <a class="profile-link" id="link">Ver no Github</a>
          <div class="footer-sociais">
                <a id="instagram" href="https://www.instagram.com/_santosiuryxz/"><i class="bi bi-instagram"></i></a>
                <a id="blog" href="https://iury-santos-dev-blog.vercel.app/"><i class="bi bi-people-fill"></i></a>
                <a id="linkedin" href="https://www.linkedin.com/in/iury-santo-480276350/"><i class="bi bi-linkedin"></i></a>
      </div>
    </header>

    <script src="jquery.js"></script>
    <script src="main.js"></script>
  </body>
</html>
